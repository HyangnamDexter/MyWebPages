# CareerCanvas theme – example config
# Copy sections into your site config.toml and replace placeholders.
# For running the site, see the Portfolio repo README: https://github.com/felipecordero/felipecordero.github.io

baseURL = "https://hyangnamdexter.github.io/MyWebPages/"
languageCode = "ko-KR"
title = "이승환"

defaultContentLanguage = "ko"
defaultContentLanguageInSubdir = false


[languages]
  [languages.ko]
    languageName = "한국어"
    weight = 1
    [languages.ko.params]
      tagline = "학부 연구생입니다. 엣지 서버 캐싱을 공부하고 있습니다."
      hero_description = "사용자 응답 지연을 줄이는 캐시 배치 방법을 공부하고 있습니다."
      hero_location = "전주, 대한민국"


[build]
  writeStats = true

[params]
  name = "이승환"
  firstName = "이승환"
  lastName = ""
  email = "a031122@jbnu.ac.kr"
  profile_image = "images/profileimg.jpg"
  author = "이승환"
  description = "이승환의 개인 소개 사이트"
  github_url = "https://github.com/HyangnamDexter"
  github_text = "github.com/HyangnamDexter"
  calendly_url = ""
  calendly_height = "700px"
  copyright = "© 2026 | 이승환"
  formspreeendpoint = ""
  pexelsapikey = ""

  [[params.social]]
    icon = "github"
    url = "https://github.com/HyangnamDexter"

[[menus.main]]
  name = "소개"
  url = "#about"
  weight = 1

[[menus.main]]
  name = "활동"
  url = "#experience"
  weight = 2

[[menus.main]]
  name = "연락"
  url = "#contact"
  weight = 3

[taxonomies]
  tag = "tags"


[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"

[server]
  [[server.headers]]
    for = "/**/*.css"
    [server.headers.values]
      Content-Type = "text/css"

[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$']

# One palette is picked at random per page load. Each needs name, main_color, second_color, third_color (hex).
[params.color_palettes]
  [[params.color_palettes.palette]]
    name = "professional"
    main_color = "#474A51"
    second_color = "#E52521"
    third_color = "#3CB043"
  [[params.color_palettes.palette]]
    name = "ocean"
    main_color = "#1E40AF"
    second_color = "#06B6D4"
    third_color = "#10B981"
  [[params.color_palettes.palette]]
    name = "steel"
    main_color = "#374151"
    second_color = "#6B7280"
    third_color = "#10B981"
  [[params.color_palettes.palette]]
    name = "slate"
    main_color = "#475569"
    second_color = "#0EA5E9"
    third_color = "#F97316"

# Pexels hero backgrounds
[params.pexels]
  queries = ["long span bridges", "skyscrapers", "sky and clouds"]
